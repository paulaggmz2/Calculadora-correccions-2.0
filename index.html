<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora TAP - NEURONORMA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

  <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8">
    
    <!-- Capçalera -->
    <div class="border-b border-slate-100 pb-5 mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">Calculadora Neuropsicològica</h1>
          <p class="text-sm text-slate-500 mt-1">Avaluació de Barems NEURONORMA</p>
        </div>
        <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-full">TAP</span>
      </div>
    </div>

    <form id="tapForm" onsubmit="return false;">
      
      <!-- Selecció de Prova (Només TAP) -->
      <div class="mb-5">
        <label for="testSelect" class="block text-sm font-semibold text-slate-700 mb-1">Prova Neuropsicològica</label>
        <select id="testSelect" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-slate-50 text-slate-800 font-medium outline-none cursor-not-allowed" disabled>
          <option value="TAP" selected>TAP (Test de Acentuación de Palabras)</option>
        </select>
      </div>

      <!-- Dades Demogràfiques i PD -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
        
        <div>
          <label for="age" class="block text-sm font-semibold text-slate-700 mb-1">Edat (Anys)</label>
          <input type="number" id="age" min="18" max="90" placeholder="Ex: 45" required
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          <p class="text-xs text-slate-400 mt-1">Rangs: 18 a 86 anys</p>
        </div>

        <div>
          <label for="edu" class="block text-sm font-semibold text-slate-700 mb-1">Escolaritat (Anys)</label>
          <input type="number" id="edu" min="0" max="20" placeholder="Ex: 12" required
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          <p class="text-xs text-slate-400 mt-1">Rangs: 0 a 20 anys</p>
        </div>

        <div>
          <label for="gender" class="block text-sm font-semibold text-slate-700 mb-1">Gènere</label>
          <select id="gender" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <option value="Home">Home</option>
            <option value="Dona">Dona</option>
            <option value="Altre">Altre</option>
          </select>
        </div>

        <div>
          <label for="pd" class="block text-sm font-semibold text-slate-700 mb-1">Puntuació Directa (PD)</label>
          <input type="number" id="pd" min="0" max="30" placeholder="0 a 30" required
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          <p class="text-xs text-slate-400 mt-1">Màxim: 30 encerts</p>
        </div>

      </div>

      <!-- Botons d'Acció -->
      <div class="flex gap-3 mb-6">
        <button type="button" onclick="calculateTAP()" 
                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition">
          Calcular Puntuació Corregida
        </button>
        <button type="button" onclick="resetForm()" 
                class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 px-4 rounded-lg transition">
          Netejar
        </button>
      </div>

    </form>

    <!-- Targeta de Resultats -->
    <div id="resultsCard" class="hidden bg-slate-50 rounded-xl p-5 border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center justify-between">
        Resultat de l'Avaluació
        <span id="badgeClass" class="text-xs font-bold px-2.5 py-1 rounded"></span>
      </h2>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
        
        <div class="bg-white p-3 rounded-lg border border-slate-200 text-center">
          <span class="block text-xs font-medium text-slate-400 uppercase">Puntuació Directa (PD)</span>
          <span id="resPD" class="text-2xl font-extrabold text-slate-700">-</span>
        </div>

        <div class="bg-white p-3 rounded-lg border border-slate-200 text-center">
          <span class="block text-xs font-medium text-slate-400 uppercase">Pe (Ajustat Edat)</span>
          <span id="resPeAge" class="text-2xl font-extrabold text-slate-700">-</span>
        </div>

        <div class="bg-white p-3 rounded-lg border border-blue-200 text-center col-span-2 md:col-span-1">
          <span class="block text-xs font-semibold text-blue-600 uppercase">Puntuació Escalar (Pe Final)</span>
          <span id="resPeFinal" class="text-2xl font-extrabold text-blue-600">-</span>
        </div>

      </div>

      <div class="bg-white p-4 rounded-lg border border-slate-200 mb-4">
        <div class="flex justify-between items-center mb-1">
          <h3 class="text-xs font-bold text-slate-400 uppercase">Classificació / Interpretació Clínica</h3>
          <span id="resPercentile" class="text-xs font-semibold text-slate-500"></span>
        </div>
        <p id="resInterp" class="text-sm font-semibold text-slate-800"></p>
      </div>

      <!-- Botó per Descarregar Excel / CSV -->
      <button type="button" onclick="exportToExcel()" 
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        Descarregar Resultat en Excel (.csv)
      </button>
    </div>

  </div>

  <script>
    // Variables globals per a l'exportació
    let currentData = null;

    // 1. DADES BAREMS EDAT
    const AGE_TABLE = [
      { pe: 2,  ranges: [[0, 13], [0, 11], [0, 15], [0, 9], [0, 8], [0, 8], [0, 10], [0, 10], [0, 4]] },
      { pe: 3,  ranges: [[14, 14], [12, 13], [16, 16], [10, 13], null, null, null, null, [5, 14]] },
      { pe: 4,  ranges: [[15, 18], [14, 17], [17, 18], [14, 17], [9, 9], null, null, null, [15, 18]] },
      { pe: 5,  ranges: [[19, 19], [18, 20], [19, 20], [18, 19], [10, 11], [9, 11], [2, 4], [2, 3], [19, 19]] },
      { pe: 6,  ranges: [[20, 20], [21, 22], [21, 22], [20, 21], [12, 13], [12, 13], [5, 13], [4, 10], [20, 20]] },
      { pe: 7,  ranges: [[21, 21], [23, 23], [23, 23], [22, 23], [14, 16], [14, 16], [14, 15], [11, 11], [21, 21]] },
      { pe: 8,  ranges: [[22, 23], [24, 24], [24, 25], [24, 24], [17, 18], [17, 18], [16, 17], [12, 14], [22, 23]] },
      { pe: 9,  ranges: [[24, 24], [25, 25], [26, 26], [25, 25], [19, 21], [19, 21], [18, 19], [15, 17], [24, 24]] },
      { pe: 10, ranges: [[25, 25], [26, 26], [27, 27], [26, 26], [22, 24], [22, 24], [20, 21], [18, 18], [25, 25]] },
      { pe: 11, ranges: [[26, 26], [27, 27], [28, 28], [27, 28], [25, 26], [25, 26], [22, 25], [19, 21], [26, 26]] },
      { pe: 12, ranges: [[27, 27], [28, 28], null, [29, 29], [27, 27], [27, 27], [26, 26], [22, 23], [27, 27]] },
      { pe: 13, ranges: [[28, 28], [29, 29], [29, 29], null, [28, 28], [28, 28], [27, 28], [24, 25], [28, 28]] },
      { pe: 14, ranges: [[29, 29], null, null, null, [29, 29], [29, 29], [29, 29], [26, 29], [29, 29]] },
      { pe: 15, ranges: [null, null, null, null, null, null, null, null, null] },
      { pe: 16, ranges: [null, null, null, null, null, null, null, null, null] },
      { pe: 17, ranges: [null, null, null, null, null, null, null, null, null] },
      { pe: 18, ranges: [[30, 30], [30, 30], [30, 30], [30, 30], [30, 30], [30, 30], [30, 30], [30, 30], [30, 30]] }
    ];

    // 2. DADES BAREMS ESCOLARITAT
    const EDU_TABLE = [
      [9,8,7,7,6,6,5,5,4,4,3,3,2,1,1,0,0,-1,-1,-2,-2],
      [10,9,8,8,7,7,6,6,5,5,4,4,3,2,2,1,1,0,0,-1,-1],
      [11,10,9,9,8,8,7,7,6,6,5,5,4,3,3,2,2,1,1,0,0],
      [12,11,10,10,9,9,8,8,7,7,6,6,5,4,4,3,3,2,2,1,1],
      [13,12,11,11,10,10,9,9,8,8,7,7,6,5,5,4,4,3,3,2,2],
      [14,13,12,12,11,11,10,10,9,9,8,8,7,6,6,5,5,4,4,3,3],
      [15,14,13,13,12,12,11,11,10,10,9,9,8,7,7,6,6,5,5,4,4],
      [16,15,14,14,13,13,12,12,11,11,10,10,9,8,8,7,7,6,6,5,5],
      [17,16,15,15,14,14,13,13,12,12,11,11,10,9,9,8,8,7,7,6,6],
      [18,17,16,16,15,15,14,14,13,13,12,12,11,10,10,9,9,8,8,7,7],
      [19,18,17,17,16,16,15,15,14,14,13,13,12,11,11,10,10,9,9,8,8],
      [20,19,18,18,17,17,16,16,15,15,14,14,13,12,12,11,11,10,10,9,9],
      [21,20,19,19,18,18,17,17,16,16,15,15,14,13,13,12,12,11,11,10,10],
      [22,21,20,20,19,19,18,18,17,17,16,16,15,14,14,13,13,12,12,11,11],
      [23,22,21,21,20,20,19,19,18,18,17,17,16,15,15,14,14,13,13,12,12],
      [24,23,22,22,21,21,20,20,19,19,18,18,17,16,16,15,15,14,14,13,13],
      [25,24,23,23,22,22,21,21,20,20,19,19,18,17,17,16,16,15,15,14,14]
    ];

    function getAgeGroupIndex(age) {
      if (age >= 18 && age <= 25) return 0;
      if (age >= 26 && age <= 35) return 1;
      if (age >= 36 && age <= 45) return 2;
      if (age >= 46 && age <= 55) return 3;
      if (age >= 56 && age <= 65) return 4;
      if (age >= 66 && age <= 70) return 5;
      if (age >= 71 && age <= 75) return 6;
      if (age >= 76 && age <= 80) return 7;
      if (age >= 81 && age <= 86) return 8;
      if (age > 86) return 8;
      return -1;
    }

    function calculateTAP() {
      const age = parseInt(document.getElementById('age').value);
      const edu = parseInt(document.getElementById('edu').value);
      const gender = document.getElementById('gender').value;
      const pd = parseFloat(document.getElementById('pd').value);

      if (isNaN(age) || isNaN(edu) || isNaN(pd)) {
        alert("Si us plau, omple tots els camps amb valors vàlids.");
        return;
      }

      const ageCol = getAgeGroupIndex(age);
      if (ageCol === -1) {
        alert("L'edat ha de ser de 18 anys o més.");
        return;
      }

      // 1. Trobar Pe segons Edat i PD
      let peAge = null;
      for (const row of AGE_TABLE) {
        const range = row.ranges[ageCol];
        if (range && pd >= range[0] && pd <= range[1]) {
          peAge = row.pe;
          break;
        }
      }

      if (peAge === null) {
        if (pd < 0) peAge = 2;
        else if (pd >= 30) peAge = 18;
        else peAge = 2;
      }

      // 2. Trobar Pe Final ajustat per Escolaritat
      const eduClamped = Math.min(Math.max(edu, 0), 20);
      const peRowIndex = Math.min(Math.max(peAge - 2, 0), 16);
      const peFinal = EDU_TABLE[peRowIndex][eduClamped];

      // 3. Classificació i Percentils
      let interp = "";
      let percentile = "";
      let badgeColor = "";

      if (peFinal >= 13) {
        interp = "Rendiment Superior / Alt";
        percentile = "> Percentil 85";
        badgeColor = "bg-emerald-100 text-emerald-800";
      } else if (peFinal >= 8) {
        interp = "Rendiment Normal / Promig";
        percentile = "Percentil 25 - 75";
        badgeColor = "bg-blue-100 text-blue-800";
      } else if (peFinal >= 6) {
        interp = "Rendiment Normal-Baix / Borderline";
        percentile = "Percentil 10 - 20";
        badgeColor = "bg-yellow-100 text-yellow-800";
      } else if (peFinal >= 4) {
        interp = "Alteració Lleu / Dèficit Moderat";
        percentile = "Percentil 2 - 5";
        badgeColor = "bg-orange-100 text-orange-800";
      } else {
        interp = "Anormal / Dèficit Greu";
        percentile = "< Percentil 2";
        badgeColor = "bg-red-100 text-red-800";
      }

      // Guardar dades actuals per a exportació
      currentData = {
        test: "TAP (Test de Acentuación de Palabras)",
        pd: pd,
        peAge: peAge,
        peFinal: peFinal,
        age: age,
        edu: edu,
        gender: gender,
        percentile: percentile,
        interp: interp
      };

      // Actualitzar interfície
      document.getElementById('resPD').innerText = pd;
      document.getElementById('resPeAge').innerText = peAge;
      document.getElementById('resPeFinal').innerText = peFinal;
      document.getElementById('resPercentile').innerText = percentile;
      document.getElementById('resInterp').innerText = interp;

      const badge = document.getElementById('badgeClass');
      badge.innerText = interp.split('/')[0];
      badge.className = `text-xs font-bold px-2.5 py-1 rounded ${badgeColor}`;

      document.getElementById('resultsCard').classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('tapForm').reset();
      document.getElementById('resultsCard').classList.add('hidden');
      currentData = null;
    }

    // Funció per generar i descarregar fitxer Excel/CSV en columnes
    function exportToExcel() {
      if (!currentData) return;

      // Capçaleres de les columnes i fila de valors
      const headers = ["Prova", "Puntuació Directa (PD)", "Puntuació Escalar (Pe Final)", "Pe Ajustat Edat", "Edat", "Escolaritat", "Gènere", "Percentil", "Classificació"];
      const values = [
        `"${currentData.test}"`,
        currentData.pd,
        currentData.peFinal,
        currentData.peAge,
        currentData.age,
        currentData.edu,
        `"${currentData.gender}"`,
        `"${currentData.percentile}"`,
        `"${currentData.interp}"`
      ];

      // Formatar contingut en CSV separat per comes amb codificació UTF-8
      const csvContent = "\uFEFF" + headers.join(";") + "\n" + values.join(";");

      // Crear l'enllaç de descàrrega
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Resultat_TAP_PD${currentData.pd}_Pe${currentData.peFinal}.csv`);
      document.body.appendChild(link);
      
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
