<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Neuropsicològica & Exportador de Base de Dades</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

  <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8">
    
    <!-- Capçalera -->
    <div class="border-b border-slate-100 pb-5 mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">Plataforma Avaluació Neuropsicològica</h1>
          <p class="text-sm text-slate-500 mt-1">Càlcul de barems i exportació estandarditzada de dades</p>
        </div>
        <span id="testBadge" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-full">TAP</span>
      </div>
    </div>

    <form id="calcForm" onsubmit="return false;">
      
      <!-- Codi Participant i Selecció de Prova -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">
        <div>
          <label for="participantCode" class="block text-sm font-semibold text-slate-700 mb-1">Codi Participant *</label>
          <input type="text" id="participantCode" placeholder="Ex: METS01" required
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none font-bold text-blue-900 uppercase">
        </div>

        <div class="md:col-span-2">
          <label for="testSelect" class="block text-sm font-semibold text-slate-700 mb-1">Selecciona la Prova a Calcular *</label>
          <select id="testSelect" onchange="onTestChange()" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg bg-white text-slate-800 font-medium outline-none focus:ring-2 focus:ring-blue-500">
            <option value="TAP">TAP (Test de Acentuación de Palabras - NEURONORMA)</option>
            <option value="WAIS_COD">Clave de Números (WAIS-III) - 1. Codificación</option>
            <option value="WAIS_EMP">Clave de Números (WAIS-III) - 2. Emparejamiento (E)</option>
            <option value="WAIS_COP">Clave de Números (WAIS-III) - 3. Copia</option>
            <option value="WAIS_ML">Clave de Números (WAIS-III) - 4. Memoria Libre (M.L.)</option>
          </select>
        </div>
      </div>

      <!-- Dades Demogràfiques i PD -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-6">
        
        <div>
          <label for="age" class="block text-sm font-semibold text-slate-700 mb-1">Edat (Anys) *</label>
          <input type="number" id="age" min="18" max="100" placeholder="Ex: 45" required
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          <p id="ageHint" class="text-xs text-slate-400 mt-1">Rangs: 18 a 86 anys</p>
        </div>

        <div id="eduGroup">
          <label for="edu" class="block text-sm font-semibold text-slate-700 mb-1">Escolaritat (Anys)</label>
          <input type="number" id="edu" min="0" max="20" placeholder="Ex: 12"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          <p class="text-xs text-slate-400 mt-1">Rangs: 0 a 20 anys</p>
        </div>

        <div id="genderGroup">
          <label for="gender" class="block text-sm font-semibold text-slate-700 mb-1">Gènere</label>
          <select id="gender" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <option value="Home">Home</option>
            <option value="Dona">Dona</option>
            <option value="Altre">Altre</option>
          </select>
        </div>

        <div>
          <label for="pd" class="block text-sm font-semibold text-slate-700 mb-1">Puntuació Directa (PD) *</label>
          <input type="number" id="pd" min="0" max="133" placeholder="Introdueix PD" required
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          <p id="pdHint" class="text-xs text-slate-400 mt-1">Màxim: 30 encerts</p>
        </div>

      </div>

      <!-- Botons d'Acció -->
      <div class="flex gap-3 mb-6">
        <button type="button" onclick="calculateScore()" 
                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition">
          Calcular Resultat
        </button>
        <button type="button" onclick="resetForm()" 
                class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 px-4 rounded-lg transition">
          Netejar
        </button>
      </div>

    </form>

    <!-- Targeta de Resultats -->
    <div id="resultsCard" class="hidden bg-slate-50 rounded-xl p-5 border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center justify-between">
        Resultats Avaluació: <span id="resParticipant" class="text-blue-700 font-extrabold ml-1"></span>
        <span id="badgeClass" class="text-xs font-bold px-2.5 py-1 rounded"></span>
      </h2>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
        
        <div class="bg-white p-3 rounded-lg border border-slate-200 text-center">
          <span class="block text-xs font-medium text-slate-400 uppercase">Puntuació Directa (PD)</span>
          <span id="resPD" class="text-2xl font-extrabold text-slate-700">-</span>
        </div>

        <div id="peAgeBox" class="bg-white p-3 rounded-lg border border-slate-200 text-center">
          <span class="block text-xs font-medium text-slate-400 uppercase">Pe (Ajustat Edat)</span>
          <span id="resPeAge" class="text-2xl font-extrabold text-slate-700">-</span>
        </div>

        <div class="bg-white p-3 rounded-lg border border-blue-200 text-center col-span-2 md:col-span-1">
          <span id="resScoreLabel" class="block text-xs font-semibold text-blue-600 uppercase">Puntuació Escalar / Percentil</span>
          <span id="resScoreValue" class="text-2xl font-extrabold text-blue-600">-</span>
        </div>

      </div>

      <div class="bg-white p-4 rounded-lg border border-slate-200 mb-5">
        <div class="flex justify-between items-center mb-1">
          <h3 class="text-xs font-bold text-slate-400 uppercase">Classificació / Interpretació Clínica</h3>
          <span id="resPercentile" class="text-xs font-semibold text-slate-500"></span>
        </div>
        <p id="resInterp" class="text-sm font-semibold text-slate-800"></p>
      </div>

      <!-- Botó per Descarregar Excel COMPLET -->
      <button type="button" onclick="exportFullExcel()" 
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        Descarregar Excel Complet amb Totes les Escales (.csv)
      </button>
    </div>

        if (test === 'WAIS_COD') pdHint.innerText = "0 a 133 punts";
        else if (test === 'WAIS_EMP') pdHint.innerText = "0 a 18 punts";
        else if (test === 'WAIS_COP') pdHint.innerText = "0 a 133 punts";
        else if (test === 'WAIS_ML') pdHint.innerText = "0 a 9 punts";
      }
      
      document.getElementById('resultsCard').classList.add('hidden');
    }

    function getTAPAgeIndex(age) {
      if (age >= 18 && age <= 25) return 0;
      if (age >= 26 && age <= 35) return 1;
      if (age >= 36 && age <= 45) return 2;
      if (age >= 46 && age <= 55) return 3;
      if (age >= 56 && age <= 65) return 4;
      if (age >= 66 && age <= 70) return 5;
      if (age >= 71 && age <= 75) return 6;
      if (age >= 76 && age <= 80) return 7;
      if (age >= 81) return 8;
      return -1;
    }

    function getWAISAgeIndex(age) {
      if (age >= 25 && age <= 34) return 0;
      if (age >= 35 && age <= 54) return 1;
      if (age >= 55 && age <= 69) return 2;
      if (age >= 70) return 3;
      return -1;
    }

    function calculateWAISPercentile(table, pd, ageCol) {
      const p10Range = table[0].ranges[ageCol];
      if (pd < p10Range[0]) return "< 10";

      let prevPc = null;
      for (let i = 0; i < table.length; i++) {
        const row = table[i];
        const range = row.ranges[ageCol];
        
        if (pd >= range[0] && pd <= range[1]) {
          return row.pc;
        }
        
        if (prevPc && pd > table[i-1].ranges[ageCol][1] && pd < range[0]) {
          return `${table[i-1].pc}-${row.pc}`;
        }
        prevPc = row.pc;
      }
      return "> 99";
    }

    function calculateScore() {
      const participant = document.getElementById('participantCode').value.trim();
      const test = document.getElementById('testSelect').value;
      const age = parseInt(document.getElementById('age').value);
      const pd = parseFloat(document.getElementById('pd').value);

      if (!participant) { alert("Si us plau, escriu el Codi del Participant (ex: METS01)."); return; }
      if (isNaN(age) || isNaN(pd)) { alert("Si us plau, omple tots els camps obligatoris."); return; }

      const peAgeBox = document.getElementById('peAgeBox');
      const resScoreLabel = document.getElementById('resScoreLabel');

      currentData = { participant };

      if (test === 'TAP') {
        peAgeBox.classList.remove('hidden');
        resScoreLabel.innerText = "Puntuació Escalar (Pe Final)";

        const edu = parseInt(document.getElementById('edu').value) || 0;
        const gender = document.getElementById('gender').value;
        const ageCol = getTAPAgeIndex(age);

        if (ageCol === -1) { alert("L'edat ha de ser de 18 anys o més."); return; }

        let peAge = null;
        for (const row of TAP_AGE_TABLE) {
          const range = row.ranges[ageCol];
          if (range && pd >= range[0] && pd <= range[1]) { peAge = row.pe; break; }
        }
        if (peAge === null) peAge = (pd >= 30) ? 18 : 2;

        const eduClamped = Math.min(Math.max(edu, 0), 20);
        const peRowIndex = Math.min(Math.max(peAge - 2, 0), 16);
        const peFinal = TAP_EDU_TABLE[peRowIndex][eduClamped];

        let interp = "", percentile = "", badgeColor = "";
        if (peFinal >= 13) { interp = "Rendiment Superior / Alt"; percentile = "> Percentil 85"; badgeColor = "bg-emerald-100 text-emerald-800"; }
        else if (peFinal >= 8) { interp = "Rendiment Normal / Promig"; percentile = "Percentil 25 - 75"; badgeColor = "bg-blue-100 text-blue-800"; }
        else if (peFinal >= 6) { interp = "Rendiment Normal-Baix / Borderline"; percentile = "Percentil 10 - 20"; badgeColor = "bg-yellow-100 text-yellow-800"; }
        else if (peFinal >= 4) { interp = "Alteració Lleu / Dèficit Moderat"; percentile = "Percentil 2 - 5"; badgeColor = "bg-orange-100 text-orange-800"; }
        else { interp = "Anormal / Dèficit Greu"; percentile = "< Percentil 2"; badgeColor = "bg-red-100 text-red-800"; }

        currentData.tap_pd_pre = pd;
        currentData.tap_pe_pre = peFinal;

        document.getElementById('resPD').innerText = pd;
        document.getElementById('resPeAge').innerText = peAge;
        document.getElementById('resScoreValue').innerText = peFinal;
        document.getElementById('resPercentile').innerText = percentile;
        document.getElementById('resInterp').innerText = interp;
        
        const badge = document.getElementById('badgeClass');
        badge.innerText = interp.split('/')[0];
        badge.className = `text-xs font-bold px-2.5 py-1 rounded ${badgeColor}`;
      }
      else if (test === 'WAIS_COD') {
        peAgeBox.classList.add('hidden');
        resScoreLabel.innerText = "Puntuació Escalar (Pe)";

        const ageCol = getWAISAgeIndex(age);
        if (ageCol === -1) { alert("L'edat ha de ser de 25 anys o més per al WAIS-III."); return; }

        let pe = null;
        for (const row of WAIS_COD_TABLE) {
          const range = row.ranges[ageCol];
          if (range && pd >= range[0] && pd <= range[1]) { pe = row.pe; break; }
        }
        if (pe === null) pe = (pd > 120) ? 19 : 2;

        let interp = "", percentile = "", badgeColor = "";
        if (pe >= 13) { interp = "Rendiment Superior"; percentile = "> Percentil 84"; badgeColor = "bg-emerald-100 text-emerald-800"; }
        else if (pe >= 8) { interp = "Rendiment Normal / Promig"; percentile = "Percentil 25 - 75"; badgeColor = "bg-blue-100 text-blue-800"; }
        else if (pe >= 6) { interp = "Rendiment Normal-Baix"; percentile = "Percentil 9 - 16"; badgeColor = "bg-yellow-100 text-yellow-800"; }
        else { interp = "Rendiment Baix / Dèficit"; percentile = "< Percentil 9"; badgeColor = "bg-red-100 text-red-800"; }

        currentData.cn_codificacio_pd_pre = pd;
        currentData.cn_codificacio_pe_pre = pe;

        document.getElementById('resPD').innerText = pd;
        document.getElementById('resScoreValue').innerText = pe;
        document.getElementById('resPercentile').innerText = percentile;
        document.getElementById('resInterp').innerText = interp;

        const badge = document.getElementById('badgeClass');
        badge.innerText = interp.split('/')[0];
        badge.className = `text-xs font-bold px-2.5 py-1 rounded ${badgeColor}`;
      }
      else {
        peAgeBox.classList.add('hidden');
        resScoreLabel.innerText = "Percentil (Pc)";

        const ageCol = getWAISAgeIndex(age);
        if (ageCol === -1) { alert("L'edat ha de ser de 25 anys o més per al WAIS-III."); return; }

        let table = WAIS_EMP_TABLE;
        let keyPd = "cn_aparellament_pd_pre", keyPc = "cn_aparellament_pc_pre";
        if (test === 'WAIS_COP') { table = WAIS_COP_TABLE; keyPd = "cn_copia_pd_pre"; keyPc = "cn_copia_pc_pre"; }
        if (test === 'WAIS_ML') { table = WAIS_ML_TABLE; keyPd = "cn_memoria_lliure_pd_pre"; keyPc = "cn_memoria_lliure_pc_pre"; }

        const pcResult = calculateWAISPercentile(table, pd, ageCol);

        let interp = "Rendiment Dins del Barem", badgeColor = "bg-blue-100 text-blue-800";
        if (pcResult.includes("90") || pcResult.includes("95") || pcResult.includes("98") || pcResult.includes("99")) {
          interp = "Rendiment Alt / Superior"; badgeColor = "bg-emerald-100 text-emerald-800";
        } else if (pcResult === "< 10" || pcResult.includes("10")) {
          interp = "Rendiment Baix / Dèficit"; badgeColor = "bg-red-100 text-red-800";
        }

        currentData[keyPd] = pd;
        currentData[keyPc] = pcResult;

        document.getElementById('resPD').innerText = pd;
        document.getElementById('resScoreValue').innerText = pcResult;
        document.getElementById('resPercentile').innerText = `Percentil: ${pcResult}`;
        document.getElementById('resInterp').innerText = interp;

        const badge = document.getElementById('badgeClass');
        badge.innerText = interp.split('/')[0];
        badge.className = `text-xs font-bold px-2.5 py-1 rounded ${badgeColor}`;
      }

      document.getElementById('resParticipant').innerText = participant;
      document.getElementById('resultsCard').classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('calcForm').reset();
      document.getElementById('resultsCard').classList.add('hidden');
      onTestChange();
      currentData = {};
    }

    // EXPORTADOR COMPLET EN UNA SOLA FILA
    function exportFullExcel() {
      if (!currentData || !currentData.participant) return;

      const rowValues = FULL_COLUMNS.map(col => {
        if (col === "codi_participant") return `"${currentData.participant}"`;
        if (currentData[col] !== undefined) return `"${currentData[col]}"`;
        return '""'; // Columna buida per a la resta de variables no calculades en aquesta sessió
      });

      const csvContent = "\uFEFF" + FULL_COLUMNS.join(";") + "\n" + rowValues.join(";");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `BaseDades_${currentData.participant}.csv`);
      document.body.appendChild(link);
      
      link.click();
      document.body.removeChild(link);
    }
  </script>
