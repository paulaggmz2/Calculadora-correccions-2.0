<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full de Càlcul Neuropsicològic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    .excel-table th, .excel-table td { border: 1px solid #cbd5e1; }
  </style>
</head>
<body class="p-4 md:p-6 min-h-screen">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Capçalera -->
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-800">Plataforma Neuropsicològica Tipus Excel</h1>
        <p class="text-xs text-slate-500 mt-0.5">Registre de participants i matriu de dades</p>
      </div>
      <button type="button" onclick="exportFullExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm py-2.5 px-4 rounded-lg shadow transition flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Descarregar Excel Complet (.csv)
      </button>
    </div>

    <!-- Formulari Unificat -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wide border-b pb-2">Entrada de Dades i Càlcul</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Codi Participant (METS_XX) *</label>
          <input type="text" id="partCode" placeholder="Ex: METS_01" class="w-full px-3 py-2 border rounded-lg font-bold text-blue-900 uppercase text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Edat (Anys) *</label>
          <input type="number" id="partAge" placeholder="Ex: 45" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Escolaritat (Anys)</label>
          <input type="number" id="partEdu" placeholder="Ex: 12" value="12" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Sexe</label>
          <select id="partGender" class="w-full px-2 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Home">Home</option>
            <option value="Dona">Dona</option>
            <option value="Altre">Altre</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t pt-4">
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Selecciona Escala / Prova *</label>
          <select id="scaleSelect" class="w-full px-3 py-2 border rounded-lg text-sm bg-white font-medium focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="TAP">TAP (Test de Acentuación de Palabras)</option>
            <option value="WAIS_COD">Clave de Números (WAIS-III) - 1. Codificación</option>
            <option value="WAIS_EMP">Clave de Números (WAIS-III) - 2. Emparejamiento (E)</option>
            <option value="WAIS_COP">Clave de Números (WAIS-III) - 3. Copia</option>
            <option value="WAIS_ML">Clave de Números (WAIS-III) - 4. Memoria Libre (M.L.)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Puntuació Directa (PD) *</label>
          <input type="number" id="scalePD" placeholder="Ex: 25" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" onclick="addScaleToExcel()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs py-2.5 rounded-lg transition shadow">
          + Calcular i Afegir al Full Excel
        </button>
        <button type="button" onclick="clearCurrentParticipant()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-xs px-4 py-2.5 rounded-lg transition">
          Netejar Tot
        </button>
      </div>
    </div>

    <!-- Vista de la Taula Tipus Excel -->
    <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200 overflow-hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wide">Matriu de Dades Excel (Vista Prèvia)</h2>
        <span class="text-xs text-slate-400">S'actualitza automàticament</span>
      </div>

      <div class="overflow-x-auto border border-slate-200 rounded-lg max-h-96">
        <table class="excel-table w-full text-left text-xs border-collapse">
          <thead class="bg-slate-100 text-slate-700 uppercase font-bold sticky top-0 z-10">
            <tr id="tableHeader"></tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-200 font-mono text-slate-800">
            <tr>
              <td colspan="15" class="text-center py-8 text-slate-400 italic">
                Introdueix un participant i una puntuació per començar.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const FULL_COLUMNS = [
      "codi_participant", "tap_pd_pre", "tap_pe_pre", "ravlt_assaig_1_pd_pre", "ravlt_assaig_1_pe_pre", 
      "ravlt_assaig_2_pd_pre", "ravlt_assaig_2_pe_pre", "ravlt_assaig_3_pd_pre", "ravlt_assaig_3_pe_pre", 
      "ravlt_assaig_4_pd_pre", "ravlt_assaig_4_pe_pre", "ravlt_assaig_5_pd_pre", "ravlt_assaig_5_pe_pre", 
      "ravlt_assaig_1_5_pd_pre", "ravlt_assaig_1_5_pe_pre", "ravlt_assaig_b_pd_pre", "ravlt_assaig_b_pe_pre", 
      "ravlt_memoria_immediata_pd_pre", "ravlt_memoria_immediata_pe_pre", "ravlt_memoria_diferida_pd_pre", 
      "ravlt_memoria_diferida_pe_pre", "ravlt_reconeixement_a_pd_pre", "ravlt_reconeixement_a_pe_pre", 
      "ravlt_reconeixement_b_pd_pre", "ravlt_reconeixement_b_pe_pre", "cn_codificacio_pd_pre", 
      "cn_codificacio_pe_pre", "cn_aparellament_pd_pre", "cn_aparellament_pc_pre", "cn_memoria_lliure_pd_pre", 
      "cn_memoria_lliure_pc_pre", "cn_copia_pd_pre", "cn_copia_pc_pre", "omissions_pd_pre", "omissions_pt_pre", 
      "commissions_pd_pre", "commissions_pt_pre", "hit_rt_pd_pre", "hit_rt_pt_pre", "hit_rt_std_error_pd_pre", 
      "hit_rt_std_error_pt_pre", "variability_pd_pre", "variability_pt_pre", "detectability_pd_pre", 
      "detectability_pt_pre", "response_style_pd_pre", "response_style_pt_pre", "perseverations_pd_pre", 
      "perseverations_pt_pre", "hit_rt_block_change_pd_pre", "hit_rt_block_change_pt_pre", 
      "hit_se_block_change_pd_pre", "hit_se_block_change_pt_pre", "hit_rt_isi_change_pd_pre", 
      "hit_rt_isi_change_pt_pre", "hit_se_isi_change_pd_pre", "hit_se_isi_change_pt_pre", 
      "bvmt_r_assaig_1_pd_pre", "bvmt_r_assaig_1_pe_pre", "bvmt_r_assaig_2_pd_pre", "bvmt_r_assaig_3_pd_pre", 
      "bvmt_r_record_total_123_pd_pre", "bvmt_r_record_total_123_pe_pre", "bvmt_r_aprenentatge_pd_pre", 
      "bvmt_r_record_diferit_4_pd_pre", "bvmt_r_record_diferit_4_pe_pre", "bvmt_r_reconeixement_encerts_pd_pre", 
      "bvmt_r_reconeixement_falsos_positius_pd_pre", "bvmt_r_index_discriminacio_pd_pre", 
      "bvmt_r_index_discriminacio_pe_pre", "bvmt_r_sesgo_resposta_pd_pre", "wms_ml_i_immediata_pd_pre", 
      "wms_ml_i_immediata_pe_pre", "wms_ml_ii_diferida_pd_pre", "wms_ml_ii_diferida_pe_pre", 
      "wms_reconeixement_pd_pre", "wms_reconeixement_percentatge_acumulat_pre", "digits_directes_span_pd_pre", 
      "digits_directes_span_pe_pre", "digits_inversos_span_pd_pre", "digits_inversos_span_pe_pre", 
      "tmt_a_pd_pre", "tmt_a_pe_pre", "tmt_b_pd_pre", "tmt_b_pe_pre", "wcst_total_correct_pd_pre", 
      "wcst_total_errors_pd_pre", "wcst_total_errors_pt_pre", "wcst_perseverative_responses_pd_pre", 
      "wcst_perseverative_responses_pt_pre", "wcst_perseverative_errors_pd_pre", 
      "wcst_perseverative_errors_pt_pre", "wcst_nonperseverative_errors_pd_pre", 
      "wcst_nonperseverative_errors_pt_pre", "wcst_conceptual_level_responses_pd_pre", 
      "wcst_conceptual_level_responses_pt_pre", "wcst_categories_completed_pd_pre", 
      "wcst_trials_to_complete_1st_category_pd_pre", "wcst_failure_to_maintain_set_pd_pre", 
      "wcst_learning_to_learn_pd_pre", "wcst_aprendre_a_aprendre_pc_pre", "stroop_p_pd_pre", 
      "stroop_p_pe_pre", "stroop_c_pd_pre", "stroop_c_pe_pre", "stroop_pc_pd_pre", "stroop_pc_pe_pre", 
      "pmr_p_pd_pre", "pmr_p_pe_pre", "pmr_m_pd_pre", "pmr_m_pe_pre", "pmr_r_pd_pre", "pmr_r_pe_pre", 
      "animals_pd_pre", "animals_pe_pre", "moca_visuoespacial_executiva_pre", "moca_identificacio_pre", 
      "moca_atencio_serie_numeros_pre", "moca_atencio_serie_lletres_pre", "moca_atencio_resta_numeros_pre", 
      "moca_atencio_total_pre", "moca_llenguatge_repeticio_pre", "moca_llenguatge_fluencia_pre", 
      "moca_abstraccio_pre", "moca_record_diferit_pre", "moca_orientacio_pre", "moca_total_pd_pre", 
      "moca_total_pe_pre", "moca_mis_pd_pre", "moca_mis_pc_pre", "fcr_exactitud_memoria_immediata_pd_pre", 
      "fcr_construccio_memoria_immediata_pd_pre", "fcr_exactitud_memoria_diferida_pd_pre", 
      "fcr_temps_memoria_immediata_pd_pre", "fcr_temps_memoria_diferida_pd_pre"
    ];

    let activeData = {};

    window.onload = function() {
      const headerRow = document.getElementById('tableHeader');
      headerRow.innerHTML = FULL_COLUMNS.map(col => `<th class="px-3 py-2 text-[11px] whitespace-nowrap bg-slate-100 border">${col}</th>`).join('');
    };

    const TAP_EDU_TABLE = [
      [9,8,7,7,6,6,5,5,4,4,3,3,2,1,1,0,0,-1,-1,-2,-2],
      [10,9,8,8,7,7,6,6,5,5,4,4,3,2,2,1,1,0,0,-1,-1],
      [11,10,9,9,8,8,7,7,6,6,5,5,4,3,3,2,2,1,1,0,0],
      [12,11,10,10,9,9,8,8,7,7,6,6,5,4,4,3,3,2,2,1,1],
      [13,12,11,11,10,10,9,9,8,8,7,7,6,5,5,4,4,3,3,2,2],
      [14,13,12,12,11,11,10,10,9,9,8,8,7,6,6,5,5,4,4,3,3],
      [15,14,13,13,12,12,11,11,10,10,9,9,8,7,7,6,6,5,5,4,4],
      [16,15,14,14,13,13,12,12,11,11,10,10,9,8,8,7,7,6,6,5,5],
      [17,16,15,15,14,14,13,13,12,12,11,11,10,9,9,8,8,7,7,6,6],
      [18,17,16,16,15,15,14,14,13,13,12,12,11,10,10,9,9,8,8,7,7],
      [19,18,17,17,16,16,15,15,14,14,13,13,12,11,11,10,10,9,9,8,8],
      [20,19,18,18,17,17,16,16,15,15,14,14,13,12,12,11,11,10,10,9,9],
      [21,20,19,19,18,18,17,17,16,16,15,15,14,13,13,12,12,11,11,10,10],
      [22,21,20,20,19,19,18,18,17,17,16,16,15,14,14,13,13,12,12,11,11],
      [23,22,21,21,20,20,19,19,18,18,17,17,16,15,15,14,14,13,13,12,12],
      [24,23,22,22,21,21,20,20,19,19,18,18,17,16,16,15,15,14,14,13,13],
      [25,24,23,23,22,22,21,21,20,20,19,19,18,17,17,16,16,15,15,14,14]
    ];

    function calculateTAP_PeAge(pd, age) {
      if (pd <= 13) return 2;
      if (pd <= 17) return 3;
      if (pd <= 19) return 4;
      if (pd <= 21) return 5;
      if (pd <= 23) return 6;
      if (pd <= 24) return 7;
      if (pd <= 25) return 8;
      if (pd <= 26) return 9;
      if (pd <= 27) return 10;
      if (pd <= 28) return 11;
      if (pd <= 29) return 12;
      return 18;
    }

    function addScaleToExcel() {
      const code = document.getElementById('partCode').value.trim();
      const age = parseInt(document.getElementById('partAge').value);
      const edu = parseInt(document.getElementById('partEdu').value) || 0;
      const pd = parseFloat(document.getElementById('scalePD').value);

      if (!code) { alert("Escriu el Codi del Participant (ex: METS_01)."); return; }
      if (isNaN(age)) { alert("Escriu l'Edat del participant."); return; }
      if (isNaN(pd)) { alert("Escriu la Puntuació Directa (PD)."); return; }

      activeData.codi_participant = code;
      activeData._age = age;
      activeData._edu = edu;

      const scale = document.getElementById('scaleSelect').value;

      if (scale === 'TAP') {
        const peAge = calculateTAP_PeAge(pd, age);
        const eduClamped = Math.min(Math.max(edu, 0), 20);
        const peRowIndex = Math.min(Math.max(peAge - 2, 0), 16);
        const peFinal = TAP_EDU_TABLE[peRowIndex][eduClamped];

        activeData.tap_pd_pre = pd;
        activeData.tap_pe_pre = peFinal;
      } 
      else if (scale === 'WAIS_COD') {
        let pe = 2;
        if (pd > 100) pe = 15;
        else if (pd > 80) pe = 12;
        else if (pd > 60) pe = 9;
        else if (pd > 40) pe = 6;

        activeData.cn_codificacio_pd_pre = pd;
        activeData.cn_codificacio_pe_pre = pe;
      }
      else {
        let keyPd = "cn_aparellament_pd_pre", keyPc = "cn_aparellament_pc_pre";
        if (scale === 'WAIS_COP') { keyPd = "cn_copia_pd_pre"; keyPc = "cn_copia_pc_pre"; }
        if (scale === 'WAIS_ML') { keyPd = "cn_memoria_lliure_pd_pre"; keyPc = "cn_memoria_lliure_pc_pre"; }

        let pcResult = "50";
        if (pd < 5) pcResult = "< 10";
        else if (pd > 15) pcResult = "> 90";

        activeData[keyPd] = pd;
        activeData[keyPc] = pcResult;
      }

      document.getElementById('scalePD').value = '';
      renderExcelTable();
    }

    function renderExcelTable() {
      const tbody = document.getElementById('tableBody');
      if (!activeData.codi_participant) {
        tbody.innerHTML = `<tr><td colspan="${FULL_COLUMNS.length}" class="text-center py-8 text-slate-400 italic">Introdueix un participant i una puntuació per començar.</td></tr>`;
        return;
      }

      const cells = FULL_COLUMNS.map(col => {
        const val = activeData[col] !== undefined ? activeData[col] : '';
        const isFilled = val !== '';
        return `<td class="px-3 py-2 whitespace-nowrap text-center ${isFilled ? 'bg-blue-100 font-bold text-blue-900 border-blue-300' : 'text-slate-300'}">${val}</td>`;
      }).join('');

      tbody.innerHTML = `<tr class="hover:bg-slate-50">${cells}</tr>`;
    }

    function clearCurrentParticipant() {
      activeData = {};
      document.getElementById('partCode').value = '';
      document.getElementById('partAge').value = '';
      document.getElementById('scalePD').value = '';
      renderExcelTable();
    }

    function exportFullExcel() {
      if (!activeData.codi_participant) {
        alert("No hi ha cap participant per exportar.");
        return;
      }

      const rowValues = FULL_COLUMNS.map(col => {
        if (activeData[col] !== undefined) return `"${activeData[col]}"`;
        return '""';
      });

      const csvContent = "\uFEFF" + FULL_COLUMNS.join(";") + "\n" + rowValues.join(";");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `Matriu_${activeData.codi_participant}.csv`);
      document.body.appendChild(link);
      
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
